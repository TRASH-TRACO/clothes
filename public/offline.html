    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>연결이 끊겼습니다 | CLOSET</title>
    <!--
      네트워크가 끊겨 화면을 못 받아왔을 때 서비스 워커가 대신 보여주는 화면.

      **앱 바깥에 있는 파일이다.** 서버에 닿지 못할 때 뜨는 화면이라
      Next 의 CSS·폰트·자바스크립트를 하나도 못 쓴다. 그래서 여기 있는 건
      전부 이 파일 안에 있다.

    <style>
      :root {
        --ink: #111111;
        --paper: #ffffff;
        --muted: #757575;
        --line: #e5e5e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f5f5f5;
          --paper: #111111;
          --muted: #9a9a9a;
          --line: #333333;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom))
          calc(24px + env(safe-area-inset-left));
        background: var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        max-width: 22em;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }
      button {
        margin-top: 18px;
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 14px 28px;
        background: var(--ink);
        color: var(--paper);
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
      }
      small {
        margin-top: 14px;
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>

    <h1>연결이 끊겼습니다</h1>
    <p>인터넷에 닿지 못해 화면을 받아오지 못했습니다. 연결을 확인하고 다시 시도해 주세요.</p>
    <button type="button" id="retry">다시 시도</button>
    <small id="hint">연결이 돌아오면 저절로 다시 엽니다.</small>

    <script>
      (function () {
        var retry = document.getElementById("retry");
        var hint = document.getElementById("hint");

        function again() {
          retry.disabled = true;
          hint.textContent = "다시 여는 중…";
          // 끊겼던 화면 주소 그대로 다시 받는다
          location.reload();
        }

        retry.addEventListener("click", again);
        // 와이파이가 돌아오면 손대지 않아도 열린다
        window.addEventListener("online", again);
      })();
    </script>
